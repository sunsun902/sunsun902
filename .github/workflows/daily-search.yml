name: Daily Update (Company + News)

on:
  schedule:
    - cron: "0 9 * * *"          # 每天 UTC 09:00（北京时间 17:00）
  workflow_dispatch:              # 支持手动触发

permissions:
  contents: write                 # 允许推送到仓库

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 执行公司搜索
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python search_script.py

      - name: 抓取热点新闻
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python news_fetcher.py

      - name: 提交所有更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: 每日数据更新 $(date -u +%Y-%m-%d)" && git push
